name: simple_ios_memo
description: "A simple iOS style memo app built with Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  video_player: ^2.8.3
  record: ^4.4.4  # Changed from ^5.0.0 to ^4.4.4 for stability and compatibility
  audioplayers: ^6.0.0
  signature: ^5.5.0
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  ios: true
  android: false
  image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
